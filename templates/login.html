{% extends 'base.html' %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card card-soft"><div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">← Volver al inicio</a>
        <span class="text-muted small">Acceso de participantes</span>
      </div>
      <h3 class="mb-3">Ingresar</h3>
      <form method="post">
        <div class="mb-3"><label class="form-label">Correo</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
